services:
  front:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/frontapp
      # 上書き防止
      - /frontapp/node_modules
      - /frontapp/.next
    ports:
      - "3030:3030"

  backend:
    build:
      context: ./backend
    env_file:
        - .env.backend.local
    volumes:
      - ./backend:/backapp
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:17.7
    env_file:
        - .env.db.local
    ports:
      - "5434:5432"
    # DBの永続化
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
